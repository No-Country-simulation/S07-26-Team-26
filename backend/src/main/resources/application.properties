spring.application.name=ghost-load-api
spring.config.import=optional:file:.env[.properties]

server.port=${SERVER_PORT:8081}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ghost_load}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

security.jwt.secret=${JWT_SECRET}
security.jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:86400}

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

spring.mail.host=${MAIL_HOST:smtp.hostinger.com}
spring.mail.port=${MAIL_PORT:465}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=${MAIL_SSL_ENABLED:true}
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

outreach.email.from-address=${MAIL_FROM_ADDRESS:${MAIL_USERNAME:no-reply@localhost}}
outreach.email.from-name=${MAIL_FROM_NAME:Ghost Load}
outreach.email.invitation-base-url=${FRONTEND_INVITATION_URL:http://localhost:5173/invitations}
outreach.email.worker-enabled=${MAIL_WORKER_ENABLED:false}
outreach.email.worker-delay-ms=${MAIL_WORKER_DELAY_MS:5000}

assessment.email.from-address=${MAIL_FROM_ADDRESS:${MAIL_USERNAME:no-reply@localhost}}
assessment.email.from-name=${MAIL_FROM_NAME:Ghost Load}
assessment.email.invitation-base-url=${FRONTEND_EVALUATION_URL:http://localhost:5173/evaluations}
