spring.application.name=ghost-load-api
spring.config.import=optional:file:./.env[.properties]

# Honra los headers X-Forwarded-* cuando la app corre detrás de un proxy
# (Nginx). Necesario para construir URLs públicas con el host real.
server.forward-headers-strategy=framework

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ghost_load}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Operational health endpoints. Only health is exposed over HTTP and its
# response never reveals component or configuration details.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,db
# SMTP has its own authenticated diagnostic endpoint and may be disabled locally.
management.health.mail.enabled=false

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001}

security.jwt.secret=${JWT_SECRET}
security.jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:86400}

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

spring.mail.host=${MAIL_HOST:smtp.hostinger.com}
spring.mail.port=${MAIL_PORT:465}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=${MAIL_SSL_ENABLED:true}
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

outreach.email.from-address=${MAIL_FROM_ADDRESS:${MAIL_USERNAME:no-reply@localhost}}
outreach.email.from-name=${MAIL_FROM_NAME:Ghost Load}
outreach.email.invitation-base-url=${FRONTEND_INVITATION_URL:http://localhost:5173/invitations}
outreach.email.worker-enabled=${MAIL_WORKER_ENABLED:false}
outreach.email.worker-delay-ms=${MAIL_WORKER_DELAY_MS:5000}

# PDF Generator (reporte institucional)
app.pdf.storage-dir=${PDF_STORAGE_DIR:./pdf-storage}
app.pdf.download-base-url=${PDF_DOWNLOAD_BASE_URL:http://localhost:8080}
app.pdf.worker-enabled=${PDF_WORKER_ENABLED:true}
app.pdf.worker-delay-ms=${PDF_WORKER_DELAY_MS:5000}
app.pdf.logo-path=${PDF_LOGO_PATH:}
app.pdf.founder.name=${PDF_FOUNDER_NAME:}
app.pdf.founder.role=${PDF_FOUNDER_ROLE:Founder}
app.pdf.founder.phone=${PDF_FOUNDER_PHONE:}
app.pdf.founder.email=${PDF_FOUNDER_EMAIL:}
app.pdf.founder.linkedin=${PDF_FOUNDER_LINKEDIN:}
app.pdf.founder.booking-url=${PDF_FOUNDER_BOOKING_URL:}
