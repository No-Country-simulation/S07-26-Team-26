services:
  postgres:
    image: postgres:16-alpine
    container_name: backend_db
    environment:
      POSTGRES_DB: ghost_load
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    container_name: backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ghost_load
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: 123
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      JWT_SECRET: ghost-load-local-jwt-secret-2026-change-me
      JWT_EXPIRATION_SECONDS: 86400
      MAIL_HOST: smtp.hostinger.com
      MAIL_PORT: 465
      MAIL_USERNAME: contacto@trinitylabs.app
      MAIL_PASSWORD: fxrbZz59M$#0fQ`4,0Wy
      MAIL_SSL_ENABLED: true
      MAIL_FROM_ADDRESS: contacto@trinitylabs.app
      MAIL_FROM_NAME: Trinity Labs
      MAIL_WORKER_ENABLED: true
      FRONTEND_INVITATION_URL: http://localhost:3001/invitations
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: frontend
    environment:
      NEXT_PUBLIC_API_URL: http://backend:8080
    ports:
      - "3001:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
